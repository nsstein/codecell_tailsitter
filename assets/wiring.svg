<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="wireTitle wireDesc">
  <title id="wireTitle">TailSitter C3 wiring overview</title>
  <desc id="wireDesc">Signal wiring between an ELRS receiver, the CodeCell C3, two ESCs and two elevon servos, with a power and grounding note.</desc>
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 28px; font-weight: 800; fill: #0f172a; }
      .sub { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #475569; }
      .h { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; }
      .h2 { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #0f172a; }
      .t { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .pin { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .fn { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #475569; }
      .lbl { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; }
      .warn { font-family: Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; fill: #7c2d12; }
    </style>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#16a34a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/>
    </marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#f8fafc"/>
  <text x="40" y="52" class="title">Wiring overview</text>
  <text x="40" y="80" class="sub">CodeCell C3 · ELRS receiver · 2 ESCs + BECs · 2 elevon servos. Signal-level view; power notes on the left.</text>

  <!-- legend -->
  <g>
    <line x1="790" y1="46" x2="820" y2="46" stroke="#16a34a" stroke-width="3"/>
    <text x="828" y="50" class="lbl">CRSF</text>
    <line x1="890" y1="46" x2="920" y2="46" stroke="#2563eb" stroke-width="3"/>
    <text x="928" y="50" class="lbl">ESC signal</text>
    <line x1="1010" y1="46" x2="1040" y2="46" stroke="#ea580c" stroke-width="3"/>
    <text x="1048" y="50" class="lbl">Servo signal</text>
    <line x1="1110" y1="46" x2="1140" y2="46" stroke="#dc2626" stroke-width="3"/>
    <text x="1148" y="50" class="lbl">5 V</text>
  </g>

  <!-- Radio -->
  <rect x="40" y="140" width="190" height="92" rx="14" class="box"/>
  <text x="135" y="170" class="h" text-anchor="middle">Radio</text>
  <text x="135" y="192" class="t" text-anchor="middle">EdgeTX / OpenTX</text>
  <text x="135" y="212" class="t" text-anchor="middle">ELRS TX · CH1–6</text>

  <!-- ELRS RX -->
  <rect x="40" y="300" width="190" height="164" rx="14" class="box"/>
  <text x="135" y="330" class="h" text-anchor="middle">ELRS RX</text>
  <text x="56" y="358" class="t">TX → IO1</text>
  <text x="56" y="380" class="t">RX ← IO2 (optional)</text>
  <text x="56" y="402" class="t">5 V / GND from BEC</text>
  <text x="56" y="424" class="t">CRSF · 420 kbaud</text>
  <text x="56" y="446" class="t">Failsafe: no pulses</text>

  <!-- CodeCell -->
  <rect x="390" y="130" width="380" height="410" rx="16" class="box"/>
  <text x="580" y="166" class="h" text-anchor="middle" font-size="22">CodeCell C3</text>
  <text x="580" y="188" class="t" text-anchor="middle">ESP32-C3 + BNO085 IMU</text>
  <line x1="414" y1="204" x2="746" y2="204" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="414" y="238" class="pin">IO1</text><text x="480" y="238" class="fn">CRSF data in (from RX TX)</text>
  <text x="414" y="272" class="pin">IO2</text><text x="480" y="272" class="fn">CRSF data out (optional)</text>
  <text x="414" y="306" class="pin">IO5</text><text x="480" y="306" class="fn">Left ESC signal</text>
  <text x="414" y="340" class="pin">IO3</text><text x="480" y="340" class="fn">Right ESC signal</text>
  <text x="414" y="374" class="pin">IO6</text><text x="480" y="374" class="fn">Left elevon servo</text>
  <text x="414" y="408" class="pin">IO7</text><text x="480" y="408" class="fn">Right elevon servo</text>
  <text x="414" y="442" class="pin">5V</text><text x="480" y="442" class="fn">5 V input from ESC BEC</text>
  <text x="414" y="476" class="pin">GND</text><text x="480" y="476" class="fn">Common ground</text>
  <text x="414" y="512" class="t" font-size="12">I2C SDA/SCL (IO8/IO9) are onboard only — do not use.</text>

  <!-- ESCs -->
  <rect x="900" y="130" width="260" height="120" rx="14" class="box"/>
  <text x="1030" y="158" class="h" text-anchor="middle">Left ESC + BEC</text>
  <text x="916" y="182" class="t">signal ← IO5</text>
  <text x="916" y="202" class="t">motor → left propeller</text>
  <text x="916" y="222" class="t">BEC 5 V → power bus</text>
  <text x="916" y="242" class="t">BLHeli / Bluejay / AM32</text>

  <rect x="900" y="280" width="260" height="120" rx="14" class="box"/>
  <text x="1030" y="308" class="h" text-anchor="middle">Right ESC + BEC</text>
  <text x="916" y="332" class="t">signal ← IO3</text>
  <text x="916" y="352" class="t">motor → right propeller</text>
  <text x="916" y="372" class="t">BEC 5 V → power bus</text>
  <text x="916" y="392" class="t">use one BEC, or cut red</text>

  <!-- Servos -->
  <rect x="900" y="470" width="260" height="92" rx="14" class="box"/>
  <text x="1030" y="498" class="h" text-anchor="middle">Left elevon servo</text>
  <text x="916" y="522" class="t">signal ← IO6</text>
  <text x="916" y="542" class="t">5 V / GND from power bus</text>

  <rect x="900" y="600" width="260" height="92" rx="14" class="box"/>
  <text x="1030" y="628" class="h" text-anchor="middle">Right elevon servo</text>
  <text x="916" y="652" class="t">signal ← IO7</text>
  <text x="916" y="672" class="t">5 V / GND from power bus</text>

  <!-- Power note -->
  <rect x="40" y="520" width="310" height="240" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="58" y="550" class="h2">Power &amp; grounds</text>
  <text x="58" y="576" class="warn">• ESC BEC 5 V → CodeCell 5V pin</text>
  <text x="58" y="598" class="warn">• → ELRS RX 5 V and servo 5 V</text>
  <text x="58" y="620" class="warn">• All grounds must be common</text>
  <text x="58" y="642" class="warn">• Use one BEC, or cut the red wire</text>
  <text x="58" y="664" class="warn">  on the second ESC (BECs can fight)</text>
  <text x="58" y="686" class="warn">• Do not use the CodeCell battery</text>
  <text x="58" y="708" class="warn">  connector in the aircraft</text>
  <text x="58" y="730" class="warn">• Size the BEC for 2 servos + RX</text>

  <!-- Before power up -->
  <rect x="390" y="580" width="380" height="180" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="408" y="610" class="h2">Before you power up</text>
  <text x="408" y="636" class="t">• Props off. Always.</text>
  <text x="408" y="658" class="t">• Check polarity before connecting the BEC.</text>
  <text x="408" y="680" class="t">• Receiver bound, Serial Protocol = CRSF.</text>
  <text x="408" y="702" class="t">• Set ESC_PROTOCOL to match your ESCs.</text>
  <text x="408" y="724" class="t">• Confirm servo and motor directions in HW_TEST.</text>
  <text x="408" y="746" class="t">• Calibrate the mount before the first flight.</text>

  <!-- Wires -->
  <path d="M135 232 V300" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="146" y="270" class="lbl">CRSF 420k</text>

  <path d="M230 330 H320 V238 H390" fill="none" stroke="#16a34a" stroke-width="3" marker-end="url(#g)"/>
  <text x="242" y="322" class="lbl">TX → IO1</text>

  <path d="M390 272 H340 V382 H230" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#g)"/>
  <text x="242" y="374" class="lbl">IO2 → RX</text>

  <path d="M770 306 H835 V190 H900" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="786" y="298" class="lbl">IO5</text>

  <path d="M770 340 H855 V340 H900" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="786" y="332" class="lbl">IO3</text>

  <path d="M770 374 H830 V516 H900" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#o)"/>
  <text x="786" y="366" class="lbl">IO6</text>

  <path d="M770 408 H870 V646 H900" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#o)"/>
  <text x="786" y="400" class="lbl">IO7</text>

  <path d="M350 558 H372 V442 H390" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="356" y="434" class="lbl">5 V</text>

  <path d="M350 590 H362 V476 H390" fill="none" stroke="#111827" stroke-width="3" marker-end="url(#r)"/>
  <text x="330" y="500" class="lbl">GND</text>

  <text x="40" y="812" class="t" font-size="12">Pin map is fixed in the sketch: CRSF_RX_PIN 1, CRSF_TX_PIN 2, MOTOR_L_PIN 5, MOTOR_R_PIN 3, SERVO_L_PIN 6, SERVO_R_PIN 7.</text>
</svg>
