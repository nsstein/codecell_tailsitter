<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">TailSitter C3 — twin-motor tail-sitting flying wing</title>
  <desc id="heroDesc">A stylized tail-sitting flying wing standing on its tail, with two propellers, elevons and a CodeCell C3 flight controller.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060a12"/>
      <stop offset="0.55" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#0e1d31"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a52"/>
      <stop offset="1" stop-color="#111a29"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233a"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)"/>
  <circle cx="930" cy="220" r="200" fill="url(#glow)"/>

  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="82" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="4">OPEN-SOURCE FLIGHT CONTROLLER</text>
    <text x="62" y="152" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="-1.5">TAILSITTER <tspan fill="#38bdf8">C3</tspan></text>
    <text x="64" y="194" fill="#cbd5e1" font-size="23">Twin-motor tail-sitting flying wing</text>
    <text x="64" y="226" fill="#94a3b8" font-size="15">Microbots CodeCell C3 · ESP32-C3 + BNO085 · ExpressLRS</text>

    <g font-size="13" font-weight="600">
      <rect x="64" y="256" width="136" height="30" rx="15" fill="#0d2233" stroke="#1d4f66"/>
      <text x="132" y="276" fill="#7dd3fc" text-anchor="middle">200 Hz IMU loop</text>
      <rect x="212" y="256" width="176" height="30" rx="15" fill="#0d2233" stroke="#1d4f66"/>
      <text x="300" y="276" fill="#7dd3fc" text-anchor="middle">Quaternion control</text>
      <rect x="400" y="256" width="206" height="30" rx="15" fill="#0d2233" stroke="#1d4f66"/>
      <text x="503" y="276" fill="#7dd3fc" text-anchor="middle">2-pose NVS calibration</text>
      <rect x="64" y="298" width="172" height="30" rx="15" fill="#241a10" stroke="#6b3d16"/>
      <text x="150" y="318" fill="#fdba74" text-anchor="middle">Differential thrust</text>
      <rect x="248" y="298" width="122" height="30" rx="15" fill="#10251c" stroke="#1d5b3f"/>
      <text x="309" y="318" fill="#86efac" text-anchor="middle">Flight log</text>
      <rect x="382" y="298" width="150" height="30" rx="15" fill="#241a10" stroke="#6b3d16"/>
      <text x="457" y="318" fill="#fdba74" text-anchor="middle">Safety interlocks</text>
    </g>
  </g>

  <path d="M700 402 H1200" stroke="#1e293b" stroke-width="2"/>
  <ellipse cx="930" cy="402" rx="178" ry="13" fill="#000000" opacity="0.55" filter="url(#soft)"/>

  <g transform="translate(930 236)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wing: nose up, leading edge to the tips, trailing edge at the bottom. -->
    <path d="M0 -152 L-182 62 L-118 100 L0 84 L118 100 L182 62 Z" fill="url(#wing)" stroke="#3d5069" stroke-width="2"/>
    <path d="M-27 -112 L27 -112 L35 82 L-35 82 Z" fill="url(#body)" stroke="#334155" stroke-width="2"/>
    <ellipse cx="0" cy="-80" rx="16" ry="27" fill="#0ea5e9" opacity="0.55"/>

    <!-- Elevons on the trailing edge (bottom when standing on the tail). -->
    <path d="M-170 64 L-110 98 L-88 90 L-142 58 Z" fill="#fb923c" opacity="0.92"/>
    <path d="M170 64 L110 98 L88 90 L142 58 Z" fill="#fb923c" opacity="0.92"/>

    <!-- Tractor motors and props on the leading edge (top when standing). -->
    <g stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.85">
      <circle cx="-92" cy="-60" r="40" stroke-dasharray="4 9"/>
      <circle cx="92" cy="-60" r="40" stroke-dasharray="4 9"/>
      <path d="M-92 -100 V-20 M-132 -60 H-52 M-120 -88 L-64 -32 M-64 -88 L-120 -32"/>
      <path d="M92 -100 V-20 M52 -60 H132 M64 -88 L120 -32 M120 -88 L64 -32"/>
    </g>
    <circle cx="-92" cy="-60" r="7" fill="#e2e8f0" stroke="none"/>
    <circle cx="92" cy="-60" r="7" fill="#e2e8f0" stroke="none"/>

    <!-- Tail skids protect the elevons when the aircraft stands on its tail. -->
    <path d="M-70 100 V150 M70 100 V150 M-92 150 H-48 M48 150 H92" stroke="#64748b" stroke-width="5"/>
  </g>

  <g font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="1082" y="22" width="86" height="30" rx="15" fill="#0d2233" stroke="#1d4f66"/>
    <text x="1125" y="42" fill="#7dd3fc" font-size="13" font-weight="700" text-anchor="middle">v26</text>
  </g>
</svg>
